<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cdfGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background rounded brand tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#cdfGoldGrad)" />
  <!-- Subtle inner border highlight -->
  <rect x="22" y="22" width="468" height="468" rx="102" ry="102" fill="none" stroke="#fef3c7" stroke-width="10" stroke-opacity="0.4" />
  <!-- Typography CDF in deep navy brand color -->
  <text x="50%" y="53%" text-anchor="middle" dominant-baseline="central" fill="#0a192f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="205" letter-spacing="-8">CDF</text>
